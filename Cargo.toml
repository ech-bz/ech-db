[workspace]
resolver = "2"
members = [
    "crates/ech-db-protocol",
    "crates/ech-db-guest",
    "crates/ech-db-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
bcs = "0.2.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
foundationdb-tuple = "0.11.0"
foundationdb = { version = "0.11.0", default-features = false, features = ["fdb-7_3"] }
blake2b_simd = "1.0.5"
ed25519-dalek = "3.0.0"
hex = "0.4"
wasmi = { version = "2.0.0", features = ["deterministic"] }
wasmi_core = "2.0.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
futures = "0.3"
axum = "0.8.9"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev.package.wasmi]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmi_core]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmi_ir]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.wasmi_collections]
opt-level = 3
debug-assertions = false
overflow-checks = false
