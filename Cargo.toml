[workspace]
resolver = "2"
members = [
    "crates/ech-db-protocol",
    "crates/ech-db-guest",
    "crates/ech-db-macros",
    "crates/ech-db-server",
    "crates/ech-db-sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde_bytes = "0.11"
bcs = "0.2.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
foundationdb-tuple = "0.11.0"
foundationdb = { version = "0.11.0", default-features = false, features = ["fdb-7_3"] }
blake2b_simd = "1.0.5"
curve25519-dalek = "5.0.0"
hex = "0.4"
getrandom = "0.3"
wasmtime = { version = "47.0.4", default-features = false, features = ["std", "runtime", "cranelift", "async", "gc", "gc-null"] }
wasmparser = { version = "0.252", default-features = false, features = ["std"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
futures = "0.3"
axum = { version = "0.8.9", features = ["http2"] }
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
